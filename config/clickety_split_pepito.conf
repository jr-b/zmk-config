# CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y

# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_ZMK_USB_LOGGING=y

# CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# The display itself is enabled by the Pepito shield (zmk-clickety-split).

# Disable idle blanking (shield enables blanking on idle)
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Uncomment to turn off WPM Status.
# CONFIG_ZMK_WIDGET_WPM_STATUS=n

CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y
# LVGL 9 renders each glyph into a heap buffer; the 4 KB default pool is too
# small for size-26 icons, which then show up as empty boxes.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Uncomment to invert colour when using nice!view Displays
# CONFIG_ZMK_DISPLAY_INVERT=y

# Uncomment to turn off battery status icon.
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=n

# Uncomment to show battery status in percent.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Enter idle mode after 5 minutes, deep sleep after 30 minutes (Clickety Split defaults).
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
